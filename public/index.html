<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --border: #334155;
            --text-main: #f8fafc; --text-muted: #94a3b8;
            --accent: #6366f1; --accent-hover: #4f46e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); line-height: 1.5; padding: 40px 20px; }
        .container { max-width: 850px; margin: 0 auto; }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.5rem; font-weight: 700; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; margin-bottom: 30px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .card h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

        textarea { width: 100%; height: 150px; background-color: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 12px; padding: 16px; font-family: 'Courier New', Courier, monospace; font-size: 0.95rem; resize: vertical; transition: border-color 0.2s; }
        textarea:focus { outline: none; border-color: var(--accent); }

        .file-upload-wrapper { position: relative; width: 100%; height: 100px; border: 2px dashed var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin: 20px 0; background-color: rgba(15, 23, 42, 0.5); transition: all 0.2s; cursor: pointer; }
        .file-upload-wrapper:hover, .file-upload-wrapper.active-paste { border-color: var(--accent); background-color: rgba(99, 102, 241, 0.05); }
        .file-upload-wrapper input[type="file"] { position: absolute; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { color: var(--text-muted); font-weight: 500; text-align: center; }

        .btn { background-color: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s; }
        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }

        .code-container { position: relative; margin-bottom: 20px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .copy-btn { position: absolute; top: 12px; right: 12px; background-color: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; }
        .copy-btn:hover { background-color: rgba(255, 255, 255, 0.2); }
        pre { margin: 0; }
        
        .image-container img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); }
        .empty-state { color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Cloud Clipboard</h1>
            <p style="color: var(--text-muted)">Securely sync snippets and screenshots across your devices.</p>
        </div>

        <div class="card">
            <h2>📤 Upload</h2>
            <form action="/share" method="POST" enctype="multipart/form-data">
                <textarea name="code" placeholder="Paste your large code blocks here..."></textarea>
                
                <div class="file-upload-wrapper" id="dropzone">
                    <span class="file-upload-text" id="fileName">
                        Click, drag, or <b>Ctrl+V</b> to paste a screenshot here
                    </span>
                    <input type="file" name="screenshot" accept="image/*" id="fileInput">
                </div>

                <button type="submit" class="btn">Push to Clipboard</button>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">📥 Current Clipboard</h2>
                <button onclick="clearClipboard()" class="btn" style="width: auto; background-color: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 8px 16px; font-size: 0.9rem;">
                    🗑️ Clear Data
                </button>
            </div>
            
            <div class="code-container">
                <button class="copy-btn" onclick="copyCode()" id="copyBtn">Copy Code</button>
                <pre><code id="displayCode" class="language-javascript empty-state">No code shared yet.</code></pre>
            </div>
            
            <div class="image-container" id="displayImage">
                <p class="empty-state">No screenshot shared yet.</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Handle Manual File Selection
        document.getElementById('fileInput').addEventListener('change', function(e) {
            updateDropzoneUI(e.target.files[0]);
        });

        // 2. Handle Ctrl+V Image Pasting
        document.addEventListener('paste', function(e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    
                    // Create a new File object from the pasted blob
                    const file = new File([blob], "pasted-screenshot.png", { type: blob.type });
                    
                    // Use DataTransfer to attach the file to the hidden input
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(file);
                    document.getElementById('fileInput').files = dataTransfer.files;
                    
                    updateDropzoneUI(file);
                    break; // Stop after finding the first image
                }
            }
        });

        // Helper to update the UI when a file is added (via click or paste)
        function updateDropzoneUI(file) {
            if (file) {
                document.getElementById('fileName').innerHTML = `🖼️ <b>${file.name}</b> (Ready to push)`;
                document.getElementById('dropzone').classList.add('active-paste');
            }
        }

        // 3. Load Data from Server
        async function loadLatest() {
            try {
                const res = await fetch('/api/latest');
                const data = await res.json();
                
                const codeElement = document.getElementById('displayCode');
                if (data.code) {
                    codeElement.textContent = data.code;
                    codeElement.classList.remove('empty-state');
                    hljs.highlightElement(codeElement);
                }

                if (data.image) {
                    document.getElementById('displayImage').innerHTML = `<img src="${data.image}?t=${Date.now()}" alt="Shared Screenshot">`;
                }
            } catch (error) {
                console.error("Failed to load clipboard data.");
            }
        }

        // 4. Copy Code to Local Clipboard
        function copyCode() {
            const codeText = document.getElementById('displayCode').textContent;
            if(codeText === 'No code shared yet.') return;

            navigator.clipboard.writeText(codeText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✓ Copied";
                btn.style.backgroundColor = "rgba(16, 185, 129, 0.2)";
                btn.style.borderColor = "rgba(16, 185, 129, 0.4)";
                btn.style.color = "#34d399";
                
                setTimeout(() => {
                    btn.innerText = "Copy Code";
                    btn.style = ""; 
                }, 2000);
            });
        }

        // 5. Clear Data on Server
        async function clearClipboard() {
            const btn = document.querySelector('button[onclick="clearClipboard()"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Clearing...";

            try {
                await fetch('/api/clear', { method: 'POST' });
                
                const codeElement = document.getElementById('displayCode');
                codeElement.textContent = "No code shared yet.";
                codeElement.className = "language-javascript empty-state"; 
                
                document.getElementById('displayImage').innerHTML = '<p class="empty-state">No screenshot shared yet.</p>';
                document.getElementById('fileName').innerHTML = 'Click, drag, or <b>Ctrl+V</b> to paste a screenshot here';
                document.getElementById('dropzone').classList.remove('active-paste');
                document.getElementById('fileInput').value = ""; // Clear the input
                
                btn.innerHTML = "✓ Cleared";
                setTimeout(() => btn.innerHTML = originalText, 2000);
            } catch (error) {
                console.error("Failed to clear clipboard.");
                btn.innerHTML = "Error";
            }
        }

        loadLatest();
    </script>
</body>
</html>
