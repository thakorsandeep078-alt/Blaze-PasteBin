<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard</title>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Highlight.js for Premium Code Formatting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.5;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 12px;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Custom File Upload Styling */
        .file-upload-wrapper {
            position: relative;
            width: 100%;
            height: 100px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            background-color: rgba(15, 23, 42, 0.5);
            transition: all 0.2s;
            cursor: pointer;
        }

        .file-upload-wrapper:hover {
            border-color: var(--accent);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .file-upload-wrapper input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-text {
            color: var(--text-muted);
            font-weight: 500;
        }

        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }

        /* Code Display Area */
        .code-container {
            position: relative;
            margin-bottom: 20px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .copy-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }

        .copy-btn:hover { background-color: rgba(255, 255, 255, 0.2); }

        pre { margin: 0; }
        
        .image-container img {
            max-width: 100%;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .empty-state {
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Cloud Clipboard</h1>
            <p style="color: var(--text-muted)">Securely sync snippets and screenshots across your devices.</p>
        </div>

        <div class="card">
            <h2>📤 Upload</h2>
            <form action="/share" method="POST" enctype="multipart/form-data">
                <textarea name="code" placeholder="Paste your large code blocks here..."></textarea>
                
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="fileName">Click or drag a screenshot here</span>
                    <input type="file" name="screenshot" accept="image/*" id="fileInput">
                </div>

                <button type="submit" class="btn">Push to Clipboard</button>
            </form>
        </div>

        <div class="card">
            <h2>📥 Current Clipboard</h2>
            
            <div class="code-container">
                <button class="copy-btn" onclick="copyCode()" id="copyBtn">Copy Code</button>
                <pre><code id="displayCode" class="language-javascript empty-state">No code shared yet.</code></pre>
            </div>
            
            <div class="image-container" id="displayImage">
                <p class="empty-state">No screenshot shared yet.</p>
            </div>
        </div>
    </div>

    <script>
        // Listen for Ctrl+V / Cmd+V anywhere on the page
        document.addEventListener('paste', function(e) {
            const items = e.clipboardData.items;
            
            for (let i = 0; i < items.length; i++) {
                // Check if the pasted item is an image
                if (items[i].type.indexOf('image') !== -1) {
                    const file = items[i].getAsFile();
                    
                    // Programmatically attach the pasted file to our file input
                    const dataTransfer = new DataTransfer();
                    const newFile = new File([file], "pasted-snip.png", { type: file.type });
                    dataTransfer.items.add(newFile);
                    
                    document.getElementById('fileInput').files = dataTransfer.files;
                    
                    // Update the UI to show it worked
                    document.getElementById('fileName').innerText = '📸 Snippet pasted! (Ready to push)';
                    document.querySelector('.file-upload-wrapper').style.borderColor = 'var(--accent)';
                    document.querySelector('.file-upload-wrapper').style.backgroundColor = 'rgba(99, 102, 241, 0.1)';
                    
                    break; // Stop after finding the first image
                }
            }
        });
    </script>
</body>
</html>
