<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Clipboard</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 200px; margin-bottom: 10px; font-family: monospace; }
        img { max-width: 100%; margin-top: 10px; border: 1px solid #ddd; }
        button { background: #007bff; color: white; border: none; padding: 10px; cursor: pointer; }
        pre { background: #2d2d2d; color: #f8f8f2; padding: 15px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Send to Clipboard</h2>
        <form action="/share" method="POST" enctype="multipart/form-data">
            <textarea name="code" placeholder="Paste code here..."></textarea><br>
            <input type="file" name="screenshot" accept="image/*" style="margin: 10px 0;"><br>
            <button type="submit">Share</button>
        </form>

        <hr style="margin: 30px 0;">

        <h2>Current Clipboard</h2>
        <button onclick="copyCode()" id="copyBtn">Copy Code</button>
        <pre><code id="displayCode">No code shared yet.</code></pre>
        <div id="displayImage"></div>
    </div>

    <script>
        async function loadLatest() {
            const res = await fetch('/api/latest');
            const data = await res.json();
            if (data.code) document.getElementById('displayCode').innerText = data.code;
            if (data.image) {
                document.getElementById('displayImage').innerHTML = `<img src="${data.image}?t=${Date.now()}">`;
            }
        }

        function copyCode() {
            navigator.clipboard.writeText(document.getElementById('displayCode').innerText).then(() => {
                document.getElementById('copyBtn').innerText = "Copied!";
                setTimeout(() => document.getElementById('copyBtn').innerText = "Copy Code", 2000);
            });
        }

        loadLatest();
    </script>
</body>
</html>
